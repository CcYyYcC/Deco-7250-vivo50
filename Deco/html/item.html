<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>KoalaSwap — Item</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --brand: #f89a3d;
                --brand-press: #ea8a25;
                --grey-2: #e8e8ec;
                --text: #17181a;
                --danger: #d93025;
                --base-w: 420px;
                --base-h: 812px;
                --bar-h: 60px;
                --toggle-size: 76px;
                --toggle-col: 96px;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
            }
            body {
                margin: 0;
                font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto,
                    Arial, sans-serif;
                color: var(--text);
                background: #fff;
            }
            .stage {
                height: 100dvh;
                width: 100vw;
                display: grid;
                place-items: start center;
                background: #fff;
                overflow: auto;
            }
            .phone {
                width: var(--base-w);
                height: var(--base-h);
                background: #fff;
                border-radius: 28px;
                box-shadow: 0 22px 64px rgba(0, 0, 0, 0.16);
                overflow: hidden;
                display: grid;
                grid-template-rows: var(--bar-h) 1fr var(--bar-h);
                transform-origin: top center;
                will-change: transform;
            }

            .appbar {
                height: var(--bar-h);
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0 16px;
                background: var(--brand);
                color: #fff;
            }
            .logo {
                width: 36px;
                height: 36px;
                border-radius: 999px;
                object-fit: cover;
            }
            .title {
                font-weight: 800;
                font-size: 18px;
            }

            .main {
                overflow: auto;
                background: #fff;
            }
            .hero {
                width: 100%;
                height: 280px;
                object-fit: cover;
            }
            .box {
                padding: 18px;
            }
            .title-row {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .title-row h2 {
                margin: 0;
                font-size: 26px;
                font-weight: 800;
            }
            .tag {
                background: #ececee;
                color: #555;
                padding: 2px 8px;
                border-radius: 999px;
                font-weight: 700;
                font-size: 13px;
            }
            .price {
                color: var(--danger);
                font-weight: 800;
                font-size: 20px;
                margin: 6px 0 14px;
            }

            .btn {
                height: 50px;
                border-radius: 12px;
                border: 0;
                font-weight: 700;
                font-size: 16px;
                cursor: pointer;
                transition: transform 0.04s, background 0.18s;
                display: block;
                width: 100%;
            }
            .btn:active {
                transform: translateY(1px);
            }
            .btn.primary {
                background: var(--brand);
                color: #fff;
                margin-bottom: 10px;
            }
            .btn.primary:hover {
                background: var(--brand-press);
            }
            .btn.outline {
                background: #fff;
                border: 2px solid var(--brand);
                color: var(--brand);
            }

            .seller-card {
                border: 1px solid var(--grey-2);
                border-radius: 14px;
                padding: 12px 14px;
                margin-top: 18px;
            }
            .seller-head {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .avatar {
                width: 48px;
                height: 48px;
                border-radius: 999px;
                background: #cfd2da;
                display: grid;
                place-items: center;
                font-size: 22px;
            }
            .seller-name {
                font-weight: 800;
            }
            .time {
                margin-left: auto;
                color: #9a9ea6;
                font-size: 12px;
            }
            .desc {
                margin-top: 12px;
                color: #333;
                line-height: 1.4;
                font-size: 15px;
            }

            .tabbar {
                height: var(--bar-h);
                background: #f3f3f6;
                border-top: 1px solid var(--grey-2);
                display: grid;
                grid-template-columns: 1fr 1fr var(--toggle-col) 1fr 1fr;
                align-items: center;
                gap: 4px;
                padding: 0 8px;
            }
            .tab {
                display: grid;
                place-items: center;
                gap: 2px;
                text-decoration: none;
                color: #666;
                font-size: 11px;
                font-weight: 700;
            }
            .tab .ico {
                width: 26px;
                height: 26px;
                object-fit: contain;
                display: block;
                opacity: 0.7;
            }
            .tab.active {
                color: var(--brand);
            }
            .tab.active .ico {
                opacity: 1;
            }
            .center-cell {
                display: grid;
                place-items: center;
            }
            .toggle-btn {
                width: var(--toggle-size);
                height: var(--toggle-size);
                border-radius: 999px;
                background: #fff;
                border: 6px solid #f3f3f6;
                display: grid;
                place-items: center;
                box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
                transform: translateY(-18px);
            }
            .toggle-btn img {
                width: 60%;
                height: 60%;
                object-fit: contain;
                display: block;
            }

            @media (max-width: 600px) {
                .stage {
                    place-items: stretch;
                }
                .phone {
                    width: 100vw;
                    height: 100vh;
                    border-radius: 0;
                    box-shadow: none;
                    transform: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="stage">
            <div class="phone" id="phone">
                <header class="appbar">
                    <img class="logo" src="assets/logo.png" alt="logo" />
                    <div class="title"></div>
                </header>

                <main class="main">
                    <!-- 顶部大图：assets/item1.jpg -->
                    <img
                        class="hero"
                        src="assets/item1.jpg"
                        alt="Item Main Image"
                    />

                    <div class="box">
                        <div class="title-row">
                            <h2>Sofa</h2>
                            <span class="tag">good</span>
                        </div>
                        <div class="price">AU $200</div>

                        <button
                            class="btn primary"
                            onclick="location.href='chat.html'"
                        >
                            Message Seller
                        </button>
                        <button class="btn outline">Buy Now</button>

                        <div class="seller-card">
                            <div class="seller-head">
                                <div class="avatar">🎓</div>
                                <div class="seller-name">John</div>
                                <div class="time">
                                    posted in St Lucia · 9 hours ago
                                </div>
                            </div>
                            <div class="desc">
                                ✨ For Sale @ UQ St Lucia ✨<br />
                                Comfy <b>2-seater sofa</b>, great condition,
                                perfect for study breaks or movie nights…<br />
                                💰 Price: <b>AU $200</b>
                            </div>
                        </div>
                    </div>
                </main>

                <nav class="tabbar">
                    <a class="tab active" href="home.html"
                        ><img
                            class="ico"
                            src="assets/icons/home.png"
                            alt="Home"
                        />
                        <div>Home</div></a
                    >
                    <a class="tab" href="chat.html"
                        ><img
                            class="ico"
                            src="assets/icons/chat.png"
                            alt="Chat"
                        />
                        <div>Chat</div></a
                    >
                    <div class="center-cell">
                        <a class="toggle-btn" href="home_stu.html"
                            ><img
                                src="assets/icons/toggle-normal.png"
                                alt="Toggle Normal"
                        /></a>
                    </div>
                    <a class="tab" href="sell.html"
                        ><img
                            class="ico"
                            src="assets/icons/sell.png"
                            alt="Sell"
                        />
                        <div>Sell</div></a
                    >
                    <a class="tab" href="profile.html"
                        ><img
                            class="ico"
                            src="assets/icons/profile.png"
                            alt="Profile"
                        />
                        <div>Profile</div></a
                    >
                </nav>
            </div>
        </div>

        <script>
            (function () {
                const phone = document.getElementById("phone");
                const BASE_H = 812;
                function applyScale() {
                    if (window.matchMedia("(max-width:600px)").matches) {
                        phone.style.transform = "none";
                        phone.style.marginTop = "0px";
                        return;
                    }
                    const vh =
                        (window.visualViewport
                            ? window.visualViewport.height
                            : window.innerHeight) - 2;
                    const scale = Math.max(1, vh / BASE_H);
                    phone.style.transform = `scale(${scale})`;
                    const scaledH = BASE_H * scale;
                    phone.style.marginTop = `${Math.max(
                        0,
                        (vh - scaledH) / 2
                    )}px`;
                }
                window.addEventListener("load", applyScale);
                window.addEventListener("resize", applyScale);
            })();
        </script>
    </body>
</html>
