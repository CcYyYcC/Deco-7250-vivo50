<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>KoalaSwap — Sell</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --brand: #f89a3d;
                --brand-press: #ea8a25;
                --grey-2: #e8e8ec;
                --text: #17181a;
                --base-w: 420px;
                --base-h: 812px;
                --bar-h: 60px;
                --toggle-size: 76px;
                --toggle-col: 96px;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
            }
            body {
                margin: 0;
                font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto,
                    Arial, sans-serif;
                color: var(--text);
                background: #fff;
            }
            .stage {
                height: 100dvh;
                width: 100vw;
                display: grid;
                place-items: start center;
                background: #fff;
                overflow: auto;
            }
            .phone {
                width: var(--base-w);
                height: var(--base-h);
                background: #fff;
                border-radius: 28px;
                box-shadow: 0 22px 64px rgba(0, 0, 0, 0.16);
                overflow: hidden;
                display: grid;
                grid-template-rows: var(--bar-h) 1fr var(--bar-h);
                transform-origin: top center;
                will-change: transform;
            }

            .appbar {
                height: var(--bar-h);
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0 16px;
                background: var(--brand);
                color: #fff;
            }
            .logo {
                width: 36px;
                height: 36px;
                border-radius: 999px;
                object-fit: cover;
            }
            .title {
                font-weight: 800;
                font-size: 18px;
            }

            .main {
                overflow: auto;
                padding: 18px;
                background: #fff;
            }
            .section-title {
                font-weight: 800;
                margin: 4px 0 10px;
                font-size: 20px;
            }

            .uploader {
                background: #f1f2f5;
                border: 2px dashed #d5d7de;
                color: #9397a2;
                border-radius: 20px;
                height: 160px;
                display: grid;
                place-items: center;
                text-align: center;
                cursor: pointer;
            }
            .preview {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 10px;
            }
            .preview img {
                width: 72px;
                height: 72px;
                object-fit: cover;
                border-radius: 10px;
                border: 1px solid #e6e6ee;
            }
            textarea {
                margin-top: 14px;
                width: 100%;
                min-height: 120px;
                border: 1px solid var(--grey-2);
                border-radius: 14px;
                padding: 12px;
                font-family: inherit;
                font-size: 15px;
                resize: vertical;
            }

            .pillset {
                display: flex;
                gap: 10px;
                margin-top: 10px;
            }
            .pill {
                padding: 8px 14px;
                border-radius: 999px;
                background: #e6e6ea;
                color: #444;
                font-weight: 700;
                cursor: pointer;
            }
            .pill.active {
                background: var(--brand);
                color: #fff;
            }
            .pill.grey {
                background: #55595f;
                color: #fff;
                opacity: 0.55;
            }

            .row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                margin-top: 18px;
            }
            .btn {
                height: 50px;
                border-radius: 12px;
                font-weight: 700;
                font-size: 16px;
                cursor: pointer;
            }
            .btn.primary {
                background: var(--brand);
                color: #fff;
                border: 0;
            }
            .btn.primary:hover {
                background: var(--brand-press);
            }
            .btn.ghost {
                background: #fff;
                border: 1px solid var(--grey-2);
            }

            .tabbar {
                height: var(--bar-h);
                background: #f3f3f6;
                border-top: 1px solid var(--grey-2);
                display: grid;
                grid-template-columns: 1fr 1fr var(--toggle-col) 1fr 1fr;
                align-items: center;
                gap: 4px;
                padding: 0 8px;
            }
            .tab {
                display: grid;
                place-items: center;
                gap: 2px;
                text-decoration: none;
                color: #666;
                font-size: 11px;
                font-weight: 700;
            }
            .tab .ico {
                width: 26px;
                height: 26px;
                object-fit: contain;
                display: block;
                opacity: 0.7;
            }
            .tab.active {
                color: var(--brand);
            }
            .tab.active .ico {
                opacity: 1;
            }
            .center-cell {
                display: grid;
                place-items: center;
            }
            .toggle-btn {
                width: var(--toggle-size);
                height: var(--toggle-size);
                border-radius: 999px;
                background: #fff;
                border: 6px solid #f3f3f6;
                display: grid;
                place-items: center;
                box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
                transform: translateY(-18px);
            }
            .toggle-btn img {
                width: 60%;
                height: 60%;
                object-fit: contain;
                display: block;
            }

            @media (max-width: 600px) {
                .stage {
                    place-items: stretch;
                }
                .phone {
                    width: 100vw;
                    height: 100vh;
                    border-radius: 0;
                    box-shadow: none;
                    transform: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="stage">
            <div class="phone" id="phone">
                <header class="appbar">
                    <img class="logo" src="assets/logo.png" alt="logo" />
                    <div class="title"></div>
                </header>

                <main class="main">
                    <h2 class="section-title">Sell</h2>

                    <label class="uploader" for="file-input"
                        >+ add some pictures for your items</label
                    >
                    <input
                        id="file-input"
                        type="file"
                        accept="image/*"
                        multiple
                        hidden
                    />
                    <div id="preview" class="preview"></div>

                    <textarea
                        placeholder="Describe the brand or some relevant information of your items"
                    ></textarea>

                    <div class="section-title">Delivery method</div>
                    <div class="pillset" id="delivery-set">
                        <span class="pill active" data-val="face"
                            >Face-to-face</span
                        >
                        <span class="pill grey" data-val="wh">Warehouse</span>
                    </div>

                    <div class="section-title">Price</div>
                    <div
                        style="
                            margin-top: 6px;
                            font-weight: 800;
                            color: #d93025;
                        "
                    >
                        AU $0.00
                    </div>

                    <div class="row">
                        <button class="btn primary">PUBLISH</button>
                        <button class="btn ghost">CANCEL</button>
                    </div>
                </main>

                <nav class="tabbar">
                    <a class="tab" href="home.html"
                        ><img
                            class="ico"
                            src="assets/icons/home.png"
                            alt="Home"
                        />
                        <div>Home</div></a
                    >
                    <a class="tab" href="chat.html"
                        ><img
                            class="ico"
                            src="assets/icons/chat.png"
                            alt="Chat"
                        />
                        <div>Chat</div></a
                    >
                    <div class="center-cell">
                        <a class="toggle-btn" href="home_stu.html"
                            ><img
                                src="assets/icons/toggle-normal.png"
                                alt="Toggle Normal"
                        /></a>
                    </div>
                    <a class="tab active" href="sell.html"
                        ><img
                            class="ico"
                            src="assets/icons/sell.png"
                            alt="Sell"
                        />
                        <div>Sell</div></a
                    >
                    <a class="tab" href="profile.html"
                        ><img
                            class="ico"
                            src="assets/icons/profile.png"
                            alt="Profile"
                        />
                        <div>Profile</div></a
                    >
                </nav>
            </div>
        </div>

        <script>
            (function () {
                const phone = document.getElementById("phone");
                const BASE_H = 812;
                function applyScale() {
                    if (window.matchMedia("(max-width:600px)").matches) {
                        phone.style.transform = "none";
                        phone.style.marginTop = "0px";
                        return;
                    }
                    const vh =
                        (window.visualViewport
                            ? window.visualViewport.height
                            : window.innerHeight) - 2;
                    const scale = Math.max(1, vh / BASE_H);
                    phone.style.transform = `scale(${scale})`;
                    const scaledH = BASE_H * scale;
                    phone.style.marginTop = `${Math.max(
                        0,
                        (vh - scaledH) / 2
                    )}px`;
                }
                window.addEventListener("load", applyScale);
                window.addEventListener("resize", applyScale);
            })();

            // 图片上传预览 + Delivery 切换
            const input = document.getElementById("file-input"),
                preview = document.getElementById("preview");
            input?.addEventListener("change", () => {
                preview.innerHTML = "";
                [...input.files].forEach((f) => {
                    const url = URL.createObjectURL(f);
                    const img = new Image();
                    img.src = url;
                    img.width = 72;
                    img.height = 72;
                    img.style.objectFit = "cover";
                    img.style.borderRadius = "10px";
                    img.style.border = "1px solid #e6e6ee";
                    preview.appendChild(img);
                });
            });
            const deliverySet = document.getElementById("delivery-set");
            deliverySet?.addEventListener("click", (e) => {
                const pill = e.target.closest(".pill");
                if (!pill) return;
                deliverySet.querySelectorAll(".pill").forEach((p) => {
                    p.classList.remove("active");
                    p.classList.add("grey");
                });
                pill.classList.add("active");
                pill.classList.remove("grey");
            });
        </script>
    </body>
</html>
