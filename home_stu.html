<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>KoalaSwap — Home (Student)</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --brand: #f89a3d;
                --grey-2: #e8e8ec;
                --text: #17181a;

                /* 设计基准尺寸（手机） */
                --base-w: 420px;
                --base-h: 812px;

                --bar-h: 60px;
                --toggle-size: 76px;
                --toggle-col: 96px;

                /* 顶栏中心 icon 尺寸（改这里就能整体调整） */
                --stu-icon-size: 28px;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
            }
            body {
                margin: 0;
                font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto,
                    Arial, sans-serif;
                color: var(--text);
                background: #fff;
            }

            .stage {
                height: 100dvh;
                width: 100vw;
                display: grid;
                place-items: start center;
                background: #fff;
                overflow: auto;
            }

            .phone {
                width: var(--base-w);
                height: var(--base-h);
                background: #fff;
                border-radius: 28px;
                box-shadow: 0 22px 64px rgba(0, 0, 0, 0.16);
                overflow: hidden;
                display: grid;
                grid-template-rows: var(--bar-h) 1fr var(--bar-h);
                transform-origin: top center;
                will-change: transform;
            }

            /* 顶部 AppBar（橙色）— 左侧 logo，stu.png 绝对居中 */
            .appbar {
                height: var(--bar-h);
                background: var(--brand);
                color: #fff;
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0 16px;
                position: relative;
            }
            .logo {
                width: 36px;
                height: 36px;
                border-radius: 999px;
                object-fit: cover;
            }
            .stu-icon {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                width: var(--stu-icon-size);
                height: var(--stu-icon-size);
                border-radius: 999px;
                object-fit: cover;
                background: #fff;
                box-shadow: 0 0 0 2px #ffffff80; /* 白色细边圈 */
            }

            /* 内容区（独立滚动） */
            .main {
                overflow: auto;
                background: #fff;
            }
            .search {
                margin: 12px 16px;
                height: 46px;
                border: 1px solid var(--grey-2);
                border-radius: 14px;
                display: flex;
                align-items: center;
                padding: 0 14px;
                color: #9a9ea9;
                font-weight: 600;
            }
            .section-title {
                font-weight: 800;
                font-size: 22px;
                margin: 16px 16px 8px;
            }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
                padding: 0 16px;
            }
            .card {
                cursor: pointer;
            }
            .card img {
                width: 100%;
                height: 140px;
                object-fit: cover;
                border-radius: 8px;
                background: #eee;
            }
            .card .meta {
                background: #9b9ca3;
                color: #fff;
                padding: 8px;
                font-weight: 700;
                border-radius: 6px;
                margin-top: 6px;
                font-size: 14px;
            }
            .chevrons {
                text-align: center;
                font-size: 22px;
                margin: 10px 0;
                color: #333;
            }

            /* 底部导航（固定） */
            .tabbar {
                height: var(--bar-h);
                background: #f3f3f6;
                border-top: 1px solid var(--grey-2);
                display: grid;
                grid-template-columns: 1fr 1fr var(--toggle-col) 1fr 1fr;
                align-items: center;
                gap: 4px;
                padding: 0 8px;
            }
            .tab {
                display: grid;
                place-items: center;
                gap: 2px;
                text-decoration: none;
                color: #666;
                font-size: 11px;
                font-weight: 700;
            }
            .tab .ico {
                width: 26px;
                height: 26px;
                object-fit: contain;
                display: block;
                opacity: 0.7;
            }
            .tab.active {
                color: var(--brand);
            }
            .tab.active .ico {
                opacity: 1;
            }

            /* 中间切换按钮（图片，无文字） */
            .center-cell {
                display: grid;
                place-items: center;
            }
            .toggle-btn {
                width: var(--toggle-size);
                height: var(--toggle-size);
                border-radius: 999px;
                background: #fff;
                border: 6px solid #f3f3f6;
                display: grid;
                place-items: center;
                box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
                transform: translateY(-18px);
            }
            .toggle-btn img {
                width: 60%;
                height: 60%;
                object-fit: contain;
                display: block;
            }

            /* 移动端：直接铺满 */
            @media (max-width: 600px) {
                .stage {
                    place-items: stretch;
                }
                .phone {
                    width: 100vw;
                    height: 100vh;
                    border-radius: 0;
                    box-shadow: none;
                    transform: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="stage">
            <div class="phone" id="phone">
                <!-- 顶部 AppBar（橙色，stu.png 直接居中叠加在顶栏） -->
                <header class="appbar">
                    <img
                        class="logo"
                        src="assets/logo.png"
                        alt="KoalaSwap Logo"
                    />
                    <img
                        class="stu-icon"
                        src="assets/icons/stu.png"
                        alt="Student Icon (assets/stu.png)"
                    />
                </header>

                <main class="main">
                    <div class="search">Search items...</div>

                    <div class="section-title">Popular Between Students</div>
                    <section class="grid">
                        <article
                            class="card"
                            onclick="location.href='item.html'"
                        >
                            <img src="assets/airfryer.jpg" alt="Air fryer" />
                            <div class="meta">Air fryer - 30 AU $</div>
                        </article>
                        <article
                            class="card"
                            onclick="location.href='item.html'"
                        >
                            <img src="assets/blender.jpg" alt="Blender" />
                            <div class="meta">Blender - 15 AU $</div>
                        </article>
                        <article
                            class="card"
                            onclick="location.href='item.html'"
                        >
                            <img src="assets/dsm.jpg" alt="DSM-5TR" />
                            <div class="meta">DSM-5TR(used) - 35 AU $</div>
                        </article>
                        <article
                            class="card"
                            onclick="location.href='item.html'"
                        >
                            <img src="assets/ielts.jpg" alt="IELTS Books" />
                            <div class="meta">IELTS Books - 110 AU $</div>
                        </article>
                    </section>

                    <div class="chevrons">⌄⌄</div>

                    <div class="section-title">Recently Viewed</div>
                    <section class="grid">
                        <article
                            class="card"
                            onclick="location.href='item.html'"
                        >
                            <img src="assets/math.jpg" alt="Cambridge Math" />
                            <div class="meta">Cambridge Math - 100 AU $</div>
                        </article>
                        <article
                            class="card"
                            onclick="location.href='item.html'"
                        >
                            <img src="assets/monitor.jpg" alt="Monitor" />
                            <div class="meta">Monitor - 180 AU $</div>
                        </article>
                    </section>
                </main>

                <nav class="tabbar" aria-label="bottom navigation">
                    <a class="tab" href="home.html">
                        <img
                            class="ico"
                            src="assets/icons/home.png"
                            alt="Home"
                        />
                        <div>Home</div>
                    </a>
                    <a class="tab" href="chat.html">
                        <img
                            class="ico"
                            src="assets/icons/chat.png"
                            alt="Chat"
                        />
                        <div>Chat</div>
                    </a>

                    <div class="center-cell">
                        <a
                            class="toggle-btn"
                            href="home.html"
                            aria-label="Switch to Normal"
                        >
                            <img
                                src="assets/icons/toggle-student.png"
                                alt="Toggle Student"
                            />
                        </a>
                    </div>

                    <a class="tab" href="sell.html">
                        <img
                            class="ico"
                            src="assets/icons/sell.png"
                            alt="Sell"
                        />
                        <div>Sell</div>
                    </a>
                    <a class="tab" href="profile.html">
                        <img
                            class="ico"
                            src="assets/icons/profile.png"
                            alt="Profile"
                        />
                        <div>Profile</div>
                    </a>
                </nav>
            </div>
        </div>

        <script>
            // 桌面端等比放大到竖向铺满（左右留白）；避免底部截断
            (function () {
                const phone = document.getElementById("phone");
                const BASE_H = 812; // 与 --base-h 一致
                function applyScale() {
                    if (window.matchMedia("(max-width:600px)").matches) {
                        phone.style.transform = "none";
                        phone.style.marginTop = "0px";
                        return;
                    }
                    const vh =
                        (window.visualViewport
                            ? window.visualViewport.height
                            : window.innerHeight) - 2;
                    const scale = Math.max(1, vh / BASE_H);
                    phone.style.transform = `scale(${scale})`;
                    const scaledH = BASE_H * scale;
                    phone.style.marginTop = `${Math.max(
                        0,
                        (vh - scaledH) / 2
                    )}px`;
                }
                window.addEventListener("load", applyScale);
                window.addEventListener("resize", applyScale);
            })();
        </script>
    </body>
</html>
