<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>KoalaSwap — Login</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --brand: #f89a3d; /* 主橙色 */
                --brand-press: #ea8a25;
                --grey-1: #f4f4f6;
                --grey-2: #e8e8ec;
                --grey-3: #cfcfd6;
                --text: #17181a;
                --muted: #7a7d86;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
            }
            body {
                margin: 0;
                font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto,
                    Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                    sans-serif;
                color: var(--text);
                background: radial-gradient(
                    900px 400px at 10% -10%,
                    #ffffff,
                    #f6f7ff 70%
                );
                display: grid;
                place-items: center;
                padding: 20px;
            }

            /* 手机画布容器（四角圆，居中） */
            .phone {
                width: min(420px, 100%);
                min-height: 92vh;
                background: #fff;
                border-radius: 28px;
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.14);
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }

            /* 顶部白色区域（模拟截图的白色弧角） */
            .corner {
                height: 22px;
                background: linear-gradient(#fff, #fff);
                border-bottom: 1px solid #ffffff00;
            }

            .content {
                padding: 28px 20px 24px;
                flex: 1 1 auto;
                overflow: auto;
            }

            /* 头部：Logo + 品牌名 + 副标题 */
            .login-head {
                display: grid;
                place-items: center;
                gap: 8px;
                margin: 14px 0 6px;
            }
            .logo {
                width: 96px;
                height: 96px;
                border-radius: 999px;
                object-fit: cover;
                box-shadow: 0 0 0 6px #ffffff, 0 8px 24px rgba(0, 0, 0, 0.18);
            }
            .brand {
                font-size: 28px;
                color: var(--brand);
                font-weight: 800;
                letter-spacing: 0.2px;
            }
            .tag {
                color: #8a8e98;
                font-weight: 600;
            }

            /* 表单 */
            .form {
                display: grid;
                gap: 14px;
                margin-top: 18px;
            }
            .label {
                font-weight: 800;
                font-size: 14px;
            }
            .input {
                height: 52px;
                border: 1px solid var(--grey-2);
                border-radius: 14px;
                padding: 0 16px;
                font-size: 16px;
                outline: none;
                transition: border-color 0.18s, box-shadow 0.18s;
            }
            .input::placeholder {
                color: #a6aab4;
            }
            .input:focus {
                border-color: #cfd6ff;
                box-shadow: 0 0 0 4px #7f8cff1f;
            }

            .btn {
                height: 54px;
                border: 0;
                border-radius: 14px;
                font-weight: 800;
                font-size: 18px;
                cursor: pointer;
                transition: transform 0.04s ease, background 0.18s ease,
                    box-shadow 0.18s ease;
            }
            .btn:active {
                transform: translateY(1px);
            }
            .btn.primary {
                background: var(--brand);
                color: #fff;
                box-shadow: 0 12px 28px #f89a3d40;
            }
            .btn.primary:hover {
                background: var(--brand-press);
            }

            .btn.ghost {
                background: #fff;
                border: 1px solid var(--grey-2);
                font-weight: 700;
            }

            .center-text {
                text-align: center;
                color: #8d9099;
            }

            .row-2 {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            /* 底部灰色引导区，和截图一致的层次 */
            .footer-hint {
                margin-top: 22px;
                text-align: center;
                color: #8d9099;
            }

            /* 小屏优化 */
            @media (max-width: 360px) {
                .brand {
                    font-size: 24px;
                }
                .logo {
                    width: 84px;
                    height: 84px;
                }
            }
        </style>
    </head>
    <body>
        <div class="phone">
            <div class="corner"></div>

            <main class="content" role="main">
                <!-- ===== 这里放品牌 Logo =====
        提示：将你的 LOGO 图片放在项目的 assets 目录下，并命名为 logo.png
        路径：assets/logo.png
        如果文件名不同，修改下面 img 的 src 即可。 -->
                <header class="login-head">
                    <img
                        class="logo"
                        src="./assets/logo.png"
                        alt="KoalaSwap Logo (请将你的logo放在 assets/logo.png)"
                    />
                    <div class="brand">KoalaSwap</div>
                    <div class="tag">From neighbours, for neighbours</div>
                </header>

                <section class="form" autocomplete="on">
                    <label class="label" for="email"
                        >Email/Student Account</label
                    >
                    <input
                        id="email"
                        class="input"
                        type="email"
                        placeholder="your.email@example.com"
                        required
                    />

                    <label class="label" for="pwd">Password</label>
                    <input
                        id="pwd"
                        class="input"
                        type="password"
                        placeholder="••••••••"
                        required
                    />

                    <button id="btn-signin" class="btn primary" type="button">
                        Sign In
                    </button>

                    <p class="center-text" style="margin: 14px 0 6px">
                        or continue with
                    </p>

                    <div class="row-2">
                        <button class="btn ghost" type="button">Google</button>
                        <button class="btn ghost" type="button">
                            Facebook
                        </button>
                    </div>

                    <p class="center-text" style="margin: 18px 0 6px">
                        <a
                            href="#"
                            style="
                                color: #e78e2c;
                                text-decoration: none;
                                font-weight: 800;
                            "
                            >Forgot Password?</a
                        >
                    </p>
                    <p class="center-text">
                        Don't have an account?
                        <a href="#" style="font-weight: 700">Sign Up</a>
                    </p>

                    <p class="footer-hint">Go to Home Page</p>
                </section>
            </main>
        </div>

        <script>
            // 点击“Sign In”后跳转到 home.html
            document
                .getElementById("btn-signin")
                .addEventListener("click", function () {
                    // 你生成完 home.html 后，这里会打开对应页面
                    window.location.href = "home.html";
                });
        </script>
    </body>
</html>
